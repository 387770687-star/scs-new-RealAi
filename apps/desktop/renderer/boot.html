<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>战略规划域多源多模态知识大脑 · 启动中</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f8fe;
      --ink: #111827;
      --muted: #64748b;
      --accent: #397eec;
      --secondary-blue: #025bfe;
      --purple: #a86cff;
      --cyan: #32cffc;
      --track: #e5edfa;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(57, 126, 236, 0.16) 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(50, 207, 252, 0.12) 0%, transparent 50%),
        radial-gradient(680px 440px at 80% 110%, rgba(168, 108, 255, 0.1) 0%, transparent 52%),
        var(--bg);
      color: var(--ink);
    }
    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(57, 126, 236, 0.14);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 18px 44px rgba(57, 126, 236, 0.12);
      text-align: center;
    }
    .brand-lockup {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 0 18px;
      text-align: left;
    }
    .brand-mark {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: linear-gradient(145deg, var(--secondary-blue), var(--accent));
      box-shadow: 0 10px 22px rgba(57, 126, 236, 0.28);
      color: #fff;
      font-size: 21px;
      font-weight: 750;
    }
    .brand {
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -0.02em;
      line-height: 1.28;
      margin: 0;
    }
    .brand span {
      display: block;
    }
    .sub {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 16px;
      border: 3px solid rgba(57, 126, 236, 0.18);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-wrap {
      margin: 0 0 16px;
      text-align: left;
    }
    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--secondary-blue), var(--accent) 55%, var(--cyan));
      box-shadow: 0 0 12px rgba(57, 126, 236, 0.35);
      transition: width 0.45s ease-out;
      position: relative;
    }
    .progress-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 30%,
        rgba(255, 255, 255, 0.45) 50%,
        transparent 70%
      );
      background-size: 200% 100%;
      animation: shimmer 1.4s linear infinite;
    }
    @keyframes shimmer {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    #pct {
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      font-weight: 600;
    }
    #status {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: #334155;
      min-height: 3em;
    }
    #hint {
      margin: 14px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="spinner" aria-hidden="true"></div>
      <div class="brand-lockup" aria-label="战略规划域多源多模态知识大脑">
        <div class="brand-mark" aria-hidden="true">R</div>
        <h1 class="brand"><span>战略规划域多源</span><span>多模态知识大脑</span></h1>
      </div>
      <p class="sub">正在打开桌面界面</p>
      <div class="progress-wrap" aria-label="启动进度">
        <div class="progress-track">
          <div id="bar" class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>
        <div class="progress-meta">
          <span>准备中</span>
          <span id="pct">0%</span>
        </div>
      </div>
      <p id="status">正在连接本地服务…</p>
      <p id="hint">首次启动可能稍慢；若长时间停在这里，请查看终端日志。</p>
    </div>
  </div>
  <script>
    (function () {
      var MIN_MS = 3000;
      var startedAt = Date.now();
      var current = 0;
      var target = 8;
      var bar = document.getElementById("bar");
      var pct = document.getElementById("pct");
      var statusEl = document.getElementById("status");
      var raf = 0;

      function render(value) {
        var v = Math.max(0, Math.min(100, value));
        current = v;
        if (bar) {
          bar.style.width = v.toFixed(1) + "%";
          bar.setAttribute("aria-valuenow", String(Math.round(v)));
        }
        if (pct) pct.textContent = Math.round(v) + "%";
      }

      function tick() {
        // Ease toward target; also drift slowly with elapsed time so ~3s feels full
        var elapsed = Date.now() - startedAt;
        var timeFloor = Math.min(92, (elapsed / MIN_MS) * 88);
        var desired = Math.max(target, timeFloor);
        if (desired > 96 && target < 100) desired = Math.min(desired, 96);
        var next = current + (desired - current) * 0.12;
        if (Math.abs(desired - next) < 0.15) next = desired;
        render(next);
        raf = requestAnimationFrame(tick);
      }

      window.__setBootStatus = function (text, progress) {
        if (statusEl && text) statusEl.textContent = String(text);
        if (typeof progress === "number" && !isNaN(progress)) {
          target = Math.max(target, Math.min(99, progress));
        }
      };

      window.__setBootProgress = function (progress) {
        if (typeof progress === "number" && !isNaN(progress)) {
          target = Math.max(0, Math.min(100, progress));
        }
      };

      /** Resolve after remaining time so splash lasts at least MIN_MS; fill bar to 100%. */
      window.__finishBootSplash = function () {
        return new Promise(function (resolve) {
          var left = Math.max(0, MIN_MS - (Date.now() - startedAt));
          target = 100;
          setTimeout(function () {
            render(100);
            resolve();
          }, left);
        });
      };

      raf = requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
